<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --accent-color: #4caf50;
            --accent-hover: #45a049;
            --danger-color: #f44336;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .tracker-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 15px;
        }

        h3 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        /* Formular zum Hinzufügen */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button.add-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.add-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Gewohnheiten-Liste */
        .habit-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .habit-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafafa;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #eee;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .habit-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .habit-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .habit-name {
            font-size: 16px;
            font-weight: 500;
        }

        .habit-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .streak-count {
            font-size: 14px;
            font-weight: bold;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 6px 12px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .check-btn {
            background-color: #eee;
            border: none;
            color: #555;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
        }

        .check-btn:hover {
            background-color: var(--accent-color);
            color: white;
        }
    </style>
</head>
<body>

<div class="tracker-container">
    <h1>Habit Tracker</h1>
    <div class="subtitle">Verfolge deine täglichen Gewohnheiten einfach und übersichtlich</div>

    <!-- Formular sendet POST-Anfrage an /add in Python -->
    <h3>Neue Gewohnheit hinzufügen</h3>
    <form action="/add" method="POST" class="input-group">
        <input type="text" name="name" placeholder="z.B. 2 Liter Wasser trinken.." autocomplete="off" required>
        <button type="submit" class="add-btn">Hinzufügen</button>
    </form>

    <h3>Meine aktuellen Gewohnheiten</h3>
    <div class="habit-list">
        {% for habit in gewohnheiten %}
        <div class="habit-item">
            <div class="habit-left">
                <span class="habit-name">{{ habit.name }}</span>
            </div>
            <div class="habit-right">
                <!-- Streak-Anzeige mit dynamischem Tag/Tage-Suffix -->
                <span class="streak-count">
                    🔥 {{ habit.streak }} {% if habit.streak == 1 %}Tag{% else %}Tage{% endif %}
                </span>

                <!-- Button ruft den Python-Endpoint /check/{id} auf -->
                <form action="/check/{{ habit.id }}" method="POST" style="margin: 0;">
                    <button type="submit" class="check-btn">Erledigt</button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
